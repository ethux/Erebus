name: Image

on:
  pull_request:
    paths:
      - "erebus/**"
      - "pro/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ethux/erebus-gateway

jobs:
  smoke:
    name: Build and smoke-test (${{ matrix.runner }})
    strategy:
      matrix:
        # Native arm64 runner: the published arm64 image is otherwise never started.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test
        run: bash deploy/smoke.sh

  publish:
    name: Publish to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Erebus Gateway
            org.opencontainers.image.licenses=AGPL-3.0-only AND Elastic-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
